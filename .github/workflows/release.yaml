name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tag must match manifest version
        run: |
          v=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest v$v"; exit 1; }
      - id: pack
        run: echo "zip=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.zip }}" --title "PRaise ${GITHUB_REF_NAME}" --generate-notes
